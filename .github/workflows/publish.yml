name: Publish to npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Check, lint, and test
        run: pnpm check && pnpm lint && pnpm test --passWithNoTests

      - name: Check for an unpublished release
        id: pending
        run: |
          VERSION=$(node -p "require('./package.json').version")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/astro-bulma/$VERSION")
          if [ "$STATUS" = "404" ]; then
            echo "Version $VERSION was released but never published; publishing it without a new release."
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" != "200" ]; then
            echo "Unexpected registry response $STATUS for $VERSION" && exit 1
          fi

      - name: Determine next version
        if: steps.pending.outputs.unpublished != 'true'
        id: version
        run: |
          TAG=$(pnpm exec git-cliff --bumped-version)
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version in package.json
        if: steps.pending.outputs.unpublished != 'true'
        run: pnpm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Generate changelog
        if: steps.pending.outputs.unpublished != 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --tag ${{ steps.version.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit and tag
        if: steps.pending.outputs.unpublished != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md package.json
          git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
          git tag ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.tag }}"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main --follow-tags

      - name: Publish to npm
        run: pnpm publish --no-git-checks --provenance --access public
